services:
  narrative_agent:
    build: .
    container_name: narrative_agent
    env_file:
      - .env_local
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./wiki:/app/wiki
      - ./logs:/app/logs
    command: streamlit run src/dashboard.py --server.address=0.0.0.0 --server.port=8501
